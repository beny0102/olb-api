name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: olb-api

      # The contract is a local dependency until it is published to npm, so CI
      # checks out both repositories side by side. This is the version-skew
      # coupling accepted in ADR 0002: the API always builds against the
      # latest contract.
      - uses: actions/checkout@v4
        with:
          repository: beny0102/olb-contract
          path: olb-contract

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # `file:` dependencies are symlinked, so the contract's runtime
      # dependencies (ajv) must be installed here. The generated types it
      # exports are committed; rebuilding it would also need Python tooling.
      - name: Install contract dependencies
        working-directory: olb-contract
        run: npm ci

      - name: Install
        working-directory: olb-api
        run: npm ci

      - name: Typecheck, build and test
        working-directory: olb-api
        run: |
          npm run typecheck
          npm run build
          npm test

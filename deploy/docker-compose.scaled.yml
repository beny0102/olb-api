name: olb-scaled

# Multi-replica deployment: two API processes, Redis for ephemeral fan-out and
# login counters, and one Caddy gateway. Use the basic compose file for the
# single-process volunteer deployment; Redis is optional there.
#
#   cp deploy/.env.scaled.example deploy/.env
#   docker compose -f deploy/docker-compose.scaled.yml up -d --build --scale api=2
#
# The gateway is the only published port. API, web and Redis stay on the
# compose network. Set PUBLIC_ORIGIN to the address users actually open.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olb}
      POSTGRES_DB: ${POSTGRES_DB:-olb}
    volumes:
      - olb-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-olb}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: olb-api/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-olb}@db:5432/${POSTGRES_DB:-olb}
      PORT: "3001"
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      REDIS_URL: redis://redis:6379
      REQUIRE_REDIS: "1"
      TRUST_PROXY: "1"
      # Two replicas must answer first-run setup with the same token. Change
      # this value before any deployment that is not local.
      SETUP_TOKEN: ${SETUP_TOKEN:-olb-scaled-setup-token-change-me}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: olb-web/Dockerfile
      args:
        # Browser traffic goes through the gateway, not to an API replica.
        NEXT_PUBLIC_API_URL: ${PUBLIC_ORIGIN:-http://localhost:8080}/api
    environment:
      # Server components also use the gateway so they reach any replica.
      API_URL: http://gateway:8080/api
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  gateway:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  olb-pgdata:

networks:
  default:
    name: olb-scaled
